[package]
name = "platform"
description = "Native input and clipboard backend contracts for Tevir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }
futures-util.workspace = true
input-event = { version = "0.4.0", default-features = false }
keycode.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
capture-engine = { package = "input-capture", version = "0.4.0", default-features = false, features = ["libei"] }
emulation-engine = { package = "input-emulation", version = "0.4.0", default-features = false, features = ["libei"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard.workspace = true
capture-engine = { package = "input-capture", version = "0.4.0", default-features = false }
emulation-engine = { package = "input-emulation", version = "0.4.0", default-features = false }

[lints]
workspace = true
