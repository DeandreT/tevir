[package]
name = "tevir"
description = "Windows and Linux Wayland network software KVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
screenshot-tests = ["eframe/__screenshot"]

[dependencies]
clap.workspace = true
directories.workspace = true
domain = { path = "../domain" }
identity = { path = "../identity" }
platform = { path = "../platform" }
protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
