[workspace]
members = [
    "crates/discovery",
    "crates/domain",
    "crates/identity",
    "crates/platform",
    "crates/protocol",
    "crates/session",
    "crates/telemetry",
    "crates/tevir",
    "crates/transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Deandre <deandredude@gmail.com>"]
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false }
ashpd = { version = "0.13.13", default-features = false, features = ["clipboard", "input_capture", "remote_desktop", "screencast", "tokio"] }
bytes = "1.12.1"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.32"
keycode = "1.0.0"
mdns-sd = { version = "0.20.2", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9.2"
rcgen = "0.14.8"
reis = { version = "0.5.0", features = ["tokio"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.24.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
