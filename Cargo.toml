[workspace]
members = [
    "crates/domain",
    "crates/platform",
    "crates/protocol",
    "crates/tevir",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Deandre <deandredude@gmail.com>"]
publish = false

[workspace.dependencies]
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
