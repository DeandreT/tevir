[workspace]
members = [
    "crates/domain",
    "crates/identity",
    "crates/platform",
    "crates/protocol",
    "crates/tevir",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Deandre <deandredude@gmail.com>"]
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
bytes = "1.12.1"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.32"
keycode = "1.0.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rcgen = "0.14.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
toml = "1.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
