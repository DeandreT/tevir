name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tevir-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tevir-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release -p tevir --target ${{ matrix.target }}

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="package/${{ matrix.artifact }}"
          mkdir -p "$package" dist
          cp "target/${{ matrix.target }}/release/tevir" README.md LICENSE "$package/"
          tar -C package -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "package/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $package, "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tevir.exe", "README.md", "LICENSE" -Destination $package
          Compress-Archive -Path $package -DestinationPath "dist/${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}.zip" |
            Out-File "dist/${{ matrix.artifact }}.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Tevir $GITHUB_REF_NAME"
          fi
